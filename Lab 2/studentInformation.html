<html>
    <head>
        <title>Student Information</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        <from action="/action_page.php">
            <fieldset>
                <table>
                    <tr>
                        <td>
                            <label for="frame">Full Name(Text)</label><br>
                            <input type="text" id="fname" name="fname" placeholder="Enter your full name">
                        </td>

                        <td>
                            <label for="frame">Email Address</label><br>
                
                            <input type="text" id="email" name="email" placeholder="your email@example.com">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="frame">Password</label><br>
                            <input type="text" id="text" name="text" placeholder="Ender secure password">
                        </td>

                        <td>
                            <label for="frame">Age(Number)</label><br>
                            <input type="number" id="email" name="number" placeholder="Enter your age">
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="frame">Experiment Date</label><br>
                            <input type="date" id="text" name="date">
                        </td>

                        <td>
                            <label for="frame">Phone Number(Tel)</label><br>
                            <input type="tel" id="email" name="tel" placeholder="+880 XXXX XXXXXX">
                        </td>
                    </tr>
                </table>

                <legend>Student Information</legend>
            </fieldset>
        </from>
    </body>
</html>
